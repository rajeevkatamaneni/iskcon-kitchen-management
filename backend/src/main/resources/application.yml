spring:
  application:
    name: kitchen-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kms}
    username: ${DB_USER:kms}
    password: ${DB_PASSWORD:kms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Deliberately NOT setting flyway.user/password here. Doing so makes Flyway derive its own
    # DataSource from the primary one, which fails because the primary is wrapped by
    # TenantAwareDataSource and cannot accept credential overrides.
    #
    # Consequence: migrations currently run as the application role. That is fine for local
    # development and tests (same user), but production wants the separate kms_migration role
    # created in Terraform, since the app role is intentionally denied DDL. Wiring that needs a
    # dedicated, unwrapped Flyway DataSource bean — tracked as part of the E1-S2 deployment
    # follow-ups rather than bolted on here.

  quartz:
    job-store-type: jdbc
    # Pinned so it matches the qrtz_locks rows seeded in V6; clustering locks against them.
    scheduler-name: kms-scheduler
    # Only the worker process fires triggers. The API service sets KMS_WORKER_ENABLED=false so
    # job execution stays off the request path; clustering below makes running more than one
    # worker safe, since each trigger then fires exactly once.
    auto-startup: ${KMS_WORKER_ENABLED:false}
    overwrite-existing-jobs: true
    jdbc:
      # Flyway (V6) owns the Quartz schema — the app role has no DDL in production.
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: "true"
      org.quartz.jobStore.clusterCheckinInterval: "20000"
      org.quartz.jobStore.misfireThreshold: "60000"
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: "5"

kms:
  firebase:
    # Off by default so the application starts without credentials for local development and
    # tests. Deployed environments set KMS_FIREBASE_ENABLED=true; with it off, every token is
    # rejected rather than accepted, so a misconfigured deployment locks people out loudly
    # instead of letting strangers in quietly.
    enabled: ${KMS_FIREBASE_ENABLED:false}
    # Firebase Auth lives in its own project, separate from the GCP runtime project — the SDK must
    # verify token audiences against this one. Not a secret (it ships in the frontend bundle).
    project-id: ${FIREBASE_PROJECT_ID:iskcon-kms-2026-620ee}

  cors:
    # Browser origins allowed to call the API. Comma-separated; the frontend's dev URL by default,
    # the real domain(s) in deployed environments (CORS_ALLOWED_ORIGINS). Never a wildcard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  notifications:
    whatsapp:
      # The Meta app secret delivery webhooks are signature-verified against. The default is a dev
      # placeholder; deployed environments set the real secret.
      app-secret: ${WHATSAPP_APP_SECRET:dev-webhook-secret}
    dev:
      # Comma-separated channels the dev adapters should force to fail (e.g. WHATSAPP), for
      # exercising the fallback cascade without a real provider. Empty in real environments.
      fail-channels: ${NOTIFICATIONS_DEV_FAIL_CHANNELS:}

  documents:
    # PDF renderer (E2-S5): 'stub' (default — no browser, keeps the suite hermetic) or 'playwright'
    # (headless Chromium; only where a browser is installed, e.g. the worker image).
    renderer: ${DOCUMENTS_RENDERER:stub}
    # Object storage: 'local' (default — a temp dir) or 'gcs' (a real bucket).
    storage: ${DOCUMENTS_STORAGE:local}
    # The GCS bucket, required when storage=gcs (e.g. iskcon-kms-2026-kms-dev-docs for local dev).
    bucket: ${DOCUMENTS_BUCKET:}
    local-dir: ${DOCUMENTS_LOCAL_DIR:${java.io.tmpdir}/kms-documents}

  translation:
    # Machine translation (E2-S6): 'stub' (default — deterministic, no network, keeps the suite
    # hermetic) or 'google' (Google Cloud Translation v3).
    provider: ${TRANSLATION_PROVIDER:stub}
    location: ${TRANSLATION_LOCATION:global}

  gcp:
    # GCP project for cloud clients (GCS, Translation). Empty falls back to the ADC default project.
    project-id: ${GCP_PROJECT_ID:}

management:
  endpoints:
    web:
      exposure:
        # prometheus + metrics feed the platform dashboards and the job-failure-rate alert
        # (Cloud Monitoring scrapes /actuator/prometheus). health/info as before.
        include: health,info,prometheus,metrics

# Error tracking (E1-S11). Inert until a DSN is set — deployed environments provide SENTRY_DSN;
# with it empty the SDK sends nothing, so local dev and tests raise no external traffic.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # Never ship personal data to the error tracker.
  send-default-pii: false

server:
  port: ${PORT:8080}
