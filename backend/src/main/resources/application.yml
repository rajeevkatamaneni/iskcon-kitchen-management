spring:
  application:
    name: kitchen-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kms}
    username: ${DB_USER:kms}
    password: ${DB_PASSWORD:kms}
  # Outbound email over an authenticated SMTP relay. Empty host means no relay is configured and the
  # email channel says so plainly rather than reporting messages sent that nobody received. Nothing
  # here is provider-specific: Mailgun, SES or a Workspace relay are the same four values.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # A relay that stops answering must not hold a worker thread open indefinitely.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Deliberately NOT setting flyway.user/password here: doing so makes Flyway derive its own
    # DataSource from the primary one, which fails because the primary is wrapped by
    # TenantAwareDataSource and cannot accept credential overrides. Where the migration role is
    # configured (below), FlywayMigrationRoleConfiguration hands Flyway a plain DataSource of its
    # own instead. Where it is not — local development, the test suite — migrations run as
    # whoever the application connects as, exactly as before.

  quartz:
    job-store-type: jdbc
    # Pinned so it matches the qrtz_locks rows seeded in V6; clustering locks against them.
    scheduler-name: kms-scheduler
    # Only the worker service fires triggers (kms-<env>-worker sets KMS_WORKER_ENABLED=true); the
    # API leaves it off so job execution stays off the request path. Clustering below makes running
    # more than one worker safe, since each trigger then fires exactly once.
    auto-startup: ${KMS_WORKER_ENABLED:false}
    overwrite-existing-jobs: true
    jdbc:
      # Flyway (V6) owns the Quartz schema — the app role has no DDL in production.
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: "true"
      org.quartz.jobStore.clusterCheckinInterval: "20000"
      org.quartz.jobStore.misfireThreshold: "60000"
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: "5"

kms:
  firebase:
    # Off by default so the application starts without credentials for local development and
    # tests. Deployed environments set KMS_FIREBASE_ENABLED=true; with it off, every token is
    # rejected rather than accepted, so a misconfigured deployment locks people out loudly
    # instead of letting strangers in quietly.
    enabled: ${KMS_FIREBASE_ENABLED:false}
    # Firebase Auth lives in its own project, separate from the GCP runtime project — the SDK must
    # verify token audiences against this one. Not a secret (it ships in the frontend bundle).
    project-id: ${FIREBASE_PROJECT_ID:iskcon-kms-2026-620ee}

  cors:
    # Browser origins allowed to call the API. Comma-separated; the frontend's dev URL by default,
    # the real domain(s) in deployed environments (CORS_ALLOWED_ORIGINS). Never a wildcard.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  notifications:
    whatsapp:
      # The Meta app secret delivery webhooks are signature-verified against. The default is a dev
      # placeholder; deployed environments set the real secret.
      app-secret: ${WHATSAPP_APP_SECRET:dev-webhook-secret}
    email:
      # Sending is always from the platform's own address: SPF and DKIM are records on the domain a
      # message claims to come from, and a temple cannot pass them for a domain it does not control.
      # Only the display name varies per temple. Empty here means this deployment cannot send email
      # and will say so, rather than reporting messages sent that nobody received.
      from: ${EMAIL_FROM:}
      platform-name: ${EMAIL_PLATFORM_NAME:ISKCON Kitchen}
    dev:
      # Comma-separated channels the dev adapters should force to fail (e.g. WHATSAPP), for
      # exercising the fallback cascade without a real provider. Empty in real environments.
      fail-channels: ${NOTIFICATIONS_DEV_FAIL_CHANNELS:}

  documents:
    # PDF renderer (E2-S5): 'stub' (default — no browser, keeps the suite hermetic) or 'playwright'
    # (headless Chromium; only where a browser is installed, e.g. the worker image).
    renderer: ${DOCUMENTS_RENDERER:stub}
    # Object storage: 'local' (default — a temp dir) or 'gcs' (a real bucket).
    storage: ${DOCUMENTS_STORAGE:local}
    # The GCS bucket, required when storage=gcs (e.g. iskcon-kms-2026-kms-dev-docs for local dev).
    bucket: ${DOCUMENTS_BUCKET:}
    local-dir: ${DOCUMENTS_LOCAL_DIR:${java.io.tmpdir}/kms-documents}

  translation:
    # Machine translation (E2-S6): 'stub' (default — deterministic, no network, keeps the suite
    # hermetic) or 'google' (Google Cloud Translation v3).
    provider: ${TRANSLATION_PROVIDER:stub}
    location: ${TRANSLATION_LOCATION:global}

  payments:
    # Payment provider (E7): 'stub' (default — no network, keeps the suite hermetic) or 'razorpay'.
    # The port lets a different provider be added and selected without touching donation logic.
    provider: ${PAYMENTS_PROVIDER:stub}
    razorpay:
      # Razorpay API credentials and webhook secret. Injected from Secrets Manager in deployed
      # environments; the webhook secret's dev placeholder lets tests sign their own fixtures.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dev-payment-webhook-secret}

  # Where a temple's own secrets live (E7): 'memory' (default — in this process, which keeps the
  # suite hermetic and local development free of a cloud dependency) or 'gcp' (Secret Manager).
  # A deployment MUST select gcp: on memory a temple's saved key survives only until the container
  # is replaced, which looks like working and is not.
  secrets:
    store: ${SECRETS_STORE:memory}
    project-id: ${SECRETS_PROJECT_ID:}

  # Names this deployment in the secrets a temple owns, so staging and production cannot collide.
  environment: ${KMS_ENVIRONMENT:local}

  # This API's own address, which is the only way it can tell a temple administrator where their
  # payment provider should send webhooks. Unset, the Settings screen would hand them a bare path
  # with no host — something that cannot be pasted into a provider's dashboard.
  api-base-url: ${API_BASE_URL:}

  db:
    migration:
      # The schema-owning role migrations run as. The application role owns nothing and holds no
      # DDL, which is only true if something else does the migrating. Empty in local development
      # and tests, where one role plays both parts.
      user: ${DB_MIGRATION_USER:}
      password: ${DB_MIGRATION_PASSWORD:}

  geocoding:
    # Turning a typed place into coordinates, so temples can be offered by distance (E1-S16):
    # 'none' (default — no map service, and the search falls back to matching temple names) or
    # 'nominatim' (OpenStreetMap's free service). Looked up once per registration, so the free
    # tier is ample; its policy asks for an honest User-Agent, which is not optional.
    provider: ${GEOCODING_PROVIDER:none}
    nominatim:
      endpoint: ${NOMINATIM_ENDPOINT:https://nominatim.openstreetmap.org/search}
      user-agent: ${NOMINATIM_USER_AGENT:ISKCON-KMS/1.0 (temple kitchen management; contact rajeevkatamaneni@gmail.com)}
      # Every temple on the platform is in India; searching the whole planet only invites
      # a Bengaluru in Texas.
      country-codes: ${NOMINATIM_COUNTRY_CODES:in}

  gcp:
    # GCP project for cloud clients (GCS, Translation). Empty falls back to the ADC default project.
    project-id: ${GCP_PROJECT_ID:}

management:
  health:
    # Whether the mail relay is answering is not whether this service is healthy. Left on, a relay
    # having a bad minute makes /actuator/health fail, and Cloud Run responds by killing instances
    # that are perfectly able to serve every page in the app. A message that cannot be sent is
    # recorded as failed and retried; that is the right blast radius, not a restart.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus + metrics feed the platform dashboards and the job-failure-rate alert
        # (Cloud Monitoring scrapes /actuator/prometheus). health/info as before.
        include: health,info,prometheus,metrics

# Error tracking (E1-S11). Inert until a DSN is set — deployed environments provide SENTRY_DSN;
# with it empty the SDK sends nothing, so local dev and tests raise no external traffic.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # Never ship personal data to the error tracker.
  send-default-pii: false

server:
  port: ${PORT:8080}
