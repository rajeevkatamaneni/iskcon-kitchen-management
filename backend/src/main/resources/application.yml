spring:
  application:
    name: kitchen-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kms}
    username: ${DB_USER:kms}
    password: ${DB_PASSWORD:kms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}
