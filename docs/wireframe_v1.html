<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISKCON Seva Kitchen — Wireframe v1</title>
<style>
  :root{
    --accent:#E07A1F;       /* saffron accent - used sparingly to direct attention */
    --accent-soft:#FDEEE0;
    --ink:#1F2328;
    --ink-soft:#5B6168;
    --line:#E6E8EB;
    --bg:#F7F8FA;
    --card:#FFFFFF;
    --good:#2E8B57;
    --warn:#C0392B;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:230px;background:var(--card);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0;}
  .brand{padding:0 20px 20px 20px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .brand-name{font-weight:700;font-size:16px;}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:14px;color:var(--ink-soft);border-left:3px solid transparent;}
  .nav-item:hover{background:var(--accent-soft);color:var(--ink);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);border-left:3px solid var(--accent);font-weight:600;}
  .nav-icon{width:20px;text-align:center;}

  /* Top bar */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);}
  .role-switch{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft);}
  .role-switch select{padding:6px 10px;border-radius:6px;border:1px solid var(--line);font-size:13px;background:#fff;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

  .content{padding:28px;overflow-y:auto;}
  .page-title{font-size:22px;font-weight:700;margin:0 0 4px 0;}
  .page-sub{color:var(--ink-soft);font-size:14px;margin:0 0 20px 0;}

  /* Tabs within a page */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tab{padding:10px 16px;font-size:13px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:600;}

  /* Cards / grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .card h4{margin:0 0 6px 0;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .stat{font-size:26px;font-weight:700;}
  .stat.alert{color:var(--warn);}
  .stat.ok{color:var(--good);}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  th,td{text-align:left;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line);}
  th{background:#FAFBFC;color:var(--ink-soft);font-weight:600;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge.low{background:#FCE9E7;color:var(--warn);}
  .badge.ok{background:#E6F4EC;color:var(--good);}
  .badge.pending{background:var(--accent-soft);color:var(--accent);}

  .btn{display:inline-block;padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}

  .section-title{font-size:15px;font-weight:700;margin:24px 0 12px 0;}
  .note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;font-size:13px;border-radius:6px;color:#8A4A0F;margin-bottom:16px;}

  .shift-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;}
  .shift-card .cap{font-size:12px;color:var(--ink-soft);}
  .shift-card .slots{margin-top:8px;font-size:13px;}
  .progress{height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden;}
  .progress span{display:block;height:100%;background:var(--accent);}

  .wishlist-card{text-align:center;}
  .wishlist-card .icon{font-size:32px;margin-bottom:8px;}
  .wishlist-card .price{font-weight:700;color:var(--accent);margin:6px 0;}

  .hidden{display:none;}
  .public-banner{background:linear-gradient(90deg,#E07A1F,#F2A44E);color:#fff;padding:30px 28px;border-radius:0 0 16px 16px;}
  .public-banner h1{margin:0 0 6px 0;font-size:24px;}
  .public-banner p{margin:0;opacity:.9;font-size:14px;}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name">🛕 ISKCON Seva Kitchen</div>
      <div class="brand-sub">Sri Sri Radha Govinda Temple</div>
    </div>
    <div id="navItems"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="role-switch">
        Viewing as:
        <select id="roleSelect" onchange="setRole(this.value)">
          <option value="admin">Temple Admin</option>
          <option value="staff">Kitchen Staff / Manager</option>
          <option value="volunteer">Volunteer</option>
          <option value="donor">Donor (Public)</option>
        </select>
      </div>
      <div class="user-chip">
        <div class="avatar">RK</div>
        Rajeev K.
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const NAV = {
  admin:[
    {id:'dashboard', label:'Dashboard', icon:'🏠'},
    {id:'kitchen', label:'Kitchen Management', icon:'🍲'},
    {id:'ordering', label:'Ordering System', icon:'📦'},
    {id:'workforce', label:'Workforce', icon:'🧑‍🤝‍🧑'},
    {id:'payments', label:'Payments & Donations', icon:'💰'},
    {id:'settings', label:'Temple Settings', icon:'⚙️'},
  ],
  staff:[
    {id:'dashboard', label:'Dashboard', icon:'🏠'},
    {id:'kitchen', label:'Kitchen Management', icon:'🍲'},
    {id:'ordering', label:'Ordering System', icon:'📦'},
    {id:'workforce', label:'Workforce', icon:'🧑‍🤝‍🧑'},
  ],
  volunteer:[
    {id:'myshifts', label:'My Shifts', icon:'📅'},
    {id:'available', label:'Available Shifts', icon:'🙋'},

  donor:[
    {id:'wishlist', label:'Wish List', icon:'🎁'},
    {id:'donate', label:'Make a Donation', icon:'💗'},
  ]
};

let role = 'admin';
let page = 'dashboard';

function setRole(r){
  role = r;
  page = NAV[r][0].id;
  render();
}

function go(p){ page = p; render(); }

function render(){
  const navHost = document.getElementById('navItems');
  navHost.innerHTML = NAV[role].map(n =>
    `<div class="nav-item ${n.id===page?'active':''}" onclick="go('${n.id}')">
       <span class="nav-icon">${n.icon}</span>${n.label}
     </div>`).join('');

  document.getElementById('sidebar').style.display = role==='donor' ? 'none' : 'block';
  document.getElementById('content').innerHTML = PAGES[page] ? PAGES[page]() : '<p>Coming soon</p>';
}

</script>

</html>
