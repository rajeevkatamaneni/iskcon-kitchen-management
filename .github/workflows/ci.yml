name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      # Pinned to v5, not v6, deliberately. v5 runs on Node 24 and remains MIT-licensed.
      # v6 extracted its caching into a proprietary component and requires accepting
      # Gradle's commercial Terms of Use — not a commitment worth making for a build
      # cache on a nonprofit project.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Testcontainers needs a Docker daemon; ubuntu-latest runners provide one.
      - name: Build and test
        working-directory: backend
        run: gradle build --no-daemon

      # Uploaded on success as well as failure: the HTML report is how you review what a
      # green build actually verified, not just what broke.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
          if-no-files-found: warn

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build
